[project]
name = "fastmem-bench"
region = "us-west-2"
profile = "fastmem-bench"
adapter = "fastmem_bench"
remote_dir = "/root/bench"
image_version = "1"

[fleet]
default_ttl = "4h"
default_owner = "agent"

[targets.c7i]
instance_type = "c7i.xlarge"
arch = "x86_64"
zig_target = "x86_64-linux-gnu"
zig_cpu = "sapphirerapids"

[targets.c8i]
instance_type = "c8i.xlarge"
arch = "x86_64"
zig_target = "x86_64-linux-gnu"
zig_cpu = "graniterapids"

[targets.c7a]
instance_type = "c7a.xlarge"
arch = "x86_64"
zig_target = "x86_64-linux-gnu"
zig_cpu = "znver4"

[targets.c8a]
instance_type = "c8a.xlarge"
arch = "x86_64"
zig_target = "x86_64-linux-gnu"
zig_cpu = "znver5"

[targets.c7g]
instance_type = "c7g.xlarge"
arch = "arm64"
zig_target = "aarch64-linux-gnu"
zig_cpu = "neoverse_v1"

[targets.c8g]
instance_type = "c8g.xlarge"
arch = "arm64"
zig_target = "aarch64-linux-gnu"
zig_cpu = "neoverse_v2"

[targets.c9g]
instance_type = "c9g.xlarge"
arch = "arm64"
zig_target = "aarch64-linux-gnu"
zig_cpu = "neoverse_v3"
